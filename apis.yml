aid: religion-of-sports
name: Religion of Sports
description: >-
  Religion of Sports is an Emmy Award-winning sports media and entertainment production studio
  founded in 2017 by Tom Brady, Michael Strahan and Gotham Chopra, headquartered in Santa Monica,
  California and operating as The Religion of Sports Media, Inc. The company produces premium
  non-fiction film, documentary series and branded content that examine why sports matter,
  distributed through Netflix, HBO, Paramount+, ESPN, Apple TV+, Showtime, Fox Sports and NBC
  Sports, with titles including Simone Biles Rising, In the Arena: Serena Williams, Made for March,
  5-Star and Alex vs. ARod. It raised a $50M Series B led by Shamrock Capital in June 2022 to build
  a non-fiction studio arm and expand into new formats and non-sports categories. Its public
  surface is a marketing and press site; the company operates no developer program, publishes no
  API documentation, and exposes no machine-readable contract.
